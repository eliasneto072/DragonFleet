server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache longo APENAS para o que tem hash no nome.
    #
    # O bloco anterior apanhava .png e .ico junto com o .js e o .css, e dava a
    # todos `expires 1y; immutable`. Mas só o que passa pelo bundler leva hash:
    # o Vite gera index-B7PZGwBA.js, que muda de nome quando muda de conteúdo.
    # Os ficheiros de public/ — favicon.ico, dragonfleet-192.png — são copiados
    # com o nome intacto.
    #
    # Consequência: trocar o logótipo não chegava a quem já tinha visitado o
    # site. O ficheiro novo tinha o nome do antigo, e o browser tinha ordem
    # expressa para não voltar a perguntar durante um ano. Nenhum rebuild
    # resolvia, porque o pedido nunca saía da máquina do utilizador.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Tudo o resto que seja estático: uma hora. Poupa pedidos no uso normal e
    # deixa uma troca de marca alastrar no mesmo dia.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # O index.html nunca: é ele que aponta para os nomes com hash. Um
    # index.html em cache serve nomes de ficheiros que já não existem, e a
    # aplicação abre em branco.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Proxy reverso para a API do backend
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Fallback para SPA — todas as rotas vão para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}