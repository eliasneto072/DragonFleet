# .github/workflows/ci.yml
#
# Corre a cada push e a cada pull request. É a parte que faz a diferença entre
# ter testes e ter uma rede de segurança: testes que só correm quando alguém se
# lembra de os correr acabam sempre por deixar de correr.
#
# NÃO precisa de base de dados. Toda a suite atual é de funções puras — a
# camada de integração, quando existir, acrescenta um serviço de Postgres aqui.
#
# O `prisma generate` é obrigatório antes dos testes: os enums (EarningPlatform,
# WithdrawalStatus, ...) são reexportados do cliente gerado, e sem ele os
# ficheiros que os importam falham em tempo de execução.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: Backend — tipos e testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `npm ci` e não `npm install`: instala exatamente o que está no lock e
      # falha se ele estiver dessincronizado do package.json. É o que garante
      # que o que corre aqui é o mesmo que corre na máquina de quem programa.
      - name: Instalar dependências
        working-directory: backend
        run: npm ci

      - name: Verificar tipos
        working-directory: backend
        run: npx tsc --noEmit

      - name: Testes
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend — tipos e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Verificar tipos
        working-directory: frontend
        run: npm run typecheck

      # O build vai além do typecheck: apanha imports que resolvem em
      # TypeScript mas não em tempo de execução, e ficheiros que faltam.
      - name: Build
        working-directory: frontend
        run: npm run build
