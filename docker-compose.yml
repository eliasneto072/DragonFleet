# Nome do projeto fixo.
#
# Sem esta linha, o Compose deriva o nome da PASTA, e os volumes ficam
# prefixados por ele. Renomear ou mover a pasta troca o volume por baixo dos
# pés: o Postgres arranca com uma base vazia e o login deixa de funcionar,
# sem nada indicar o porquê.
name: dragonfleet

services:
  # ──────────────────────────────────────────
  # Banco de dados PostgreSQL
  # ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dragonfleet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # PostgreSQL só para testes
  # ──────────────────────────────────────────
  #
  # Separado do de desenvolvimento de propósito. Os testes de integração
  # APAGAM todas as tabelas entre casos; apontados à base de trabalho,
  # levariam à frente o seed e tudo o que estivesse a ser experimentado.
  #
  # Porta diferente (5434) e SEM volume: o estado vive na memória do
  # contentor e desaparece quando ele para. Um teste que dependa de dados
  # deixados por outro passa a falhar já na primeira execução, em vez de
  # falhar meses depois quando alguém trocar a ordem — que é o pior modo de
  # falha possível numa suite.
  postgres-test:
    image: postgres:16-alpine
    container_name: dragonfleet-postgres-test
    # Sem restart: só está de pé quando se corre testes.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dragonfleet_test
    ports:
      - "5434:5432"
    # tmpfs: a base inteira em memória. Deixa a suite muito mais rápida,
    # porque o Postgres deixa de esperar pelo disco a cada TRUNCATE.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dragonfleet_test"]
      interval: 3s
      timeout: 3s
      retries: 10

  # ──────────────────────────────────────────
  # API — Node.js / Express / Prisma
  # ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dragonfleet-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      PORT: 3000
      # NODE_ENV decide o grau de exigência: em 'production' o servidor recusa
      # arrancar sem segredos fortes, sem CORS e sem Cloudinary. Fora dela,
      # tolera as ausências para uma máquina acabada de clonar funcionar.
      NODE_ENV: ${NODE_ENV:-development}
      # Endereços do frontend, separados por vírgula. Obrigatório em produção.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      CLOUD_NAME: ${CLOUD_NAME}
      API_KEY: ${API_KEY}
      API_SECRET: ${API_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # ──────────────────────────────────────────
  # Frontend — React + Vite → Nginx
  # ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: dragonfleet-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: